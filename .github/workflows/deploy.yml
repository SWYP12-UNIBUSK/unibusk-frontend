name: Deploy to Cloudflare Workers

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Cloudflare Workers용 빌드
      - name: Build for Cloudflare
        env:
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: pnpm exec opennextjs-cloudflare build
      
      # Cloudflare 배포
      - name: Deploy Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name unibusk-preview-${{ github.event.pull_request.number }}
          packageManager: pnpm
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Preview | ${{ job.status }} | https://unibusk-preview-${{ github.event.pull_request.number }}.swyp.workers.dev |" >> $GITHUB_STEP_SUMMARY
  
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Cloudflare Workers용 빌드
      - name: Build for Cloudflare
        env:
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: pnpm exec opennextjs-cloudflare build
      
      # Cloudflare 배포
      - name: Deploy Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ job.status }} | [https://unibusk.site](https://unibusk.site) |" >> $GITHUB_STEP_SUMMARY

  lighthouse:
    if: github.event_name == 'pull_request'
    needs: preview
    runs-on: ubuntu-latest
    env:
      LHCI_BASE_URL: https://unibusk-preview-${{ github.event.pull_request.number }}.swyp.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Wait for preview to be ready
        run: |
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$LHCI_BASE_URL")
            if [ "$code" = "200" ]; then echo "ready"; exit 0; fi
            echo "attempt $i: $code"; sleep 5
          done
          echo "preview not ready"; exit 1

      - name: Warm up pages before Lighthouse
        run: |
          urls=(
            "$LHCI_BASE_URL"
            "$LHCI_BASE_URL/busking-map"
            "$LHCI_BASE_URL/performance-list?tab=upcoming"
            "$LHCI_BASE_URL/performance-list?tab=past"
            "$LHCI_BASE_URL/about-us"
          )
          for url in "${urls[@]}"; do
            echo "Warming up: $url"
            curl -s -o /dev/null "$url"
          done
          sleep 3

      - name: Run Lighthouse CI
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec lhci autorun --config=.lighthouserc.ci.js
