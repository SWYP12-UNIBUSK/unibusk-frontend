name: Deploy to Cloudflare Workers

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Cloudflare Workers용 빌드
      - name: Build for Cloudflare
        env:
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: pnpm exec opennextjs-cloudflare build
      
      # Cloudflare 배포
      - name: Deploy Preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --name unibusk-preview-${{ github.event.pull_request.number }}
          packageManager: pnpm
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Preview | ${{ job.status }} | https://unibusk-preview-${{ github.event.pull_request.number }}.swyp.workers.dev |" >> $GITHUB_STEP_SUMMARY
  
  production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2
      
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # Cloudflare Workers용 빌드
      - name: Build for Cloudflare
        env:
          API_URL: ${{ secrets.API_URL }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ secrets.NEXT_PUBLIC_KAKAO_MAP_APP_KEY }}
        run: pnpm exec opennextjs-cloudflare build
      
      # Cloudflare 배포
      - name: Deploy Production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm
      
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 🚀 Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "| Type | Status | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Production | ${{ job.status }} | [https://unibusk.site](https://unibusk.site) |" >> $GITHUB_STEP_SUMMARY

  lighthouse:
    if: github.event_name == 'pull_request'
    needs: preview
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    env:
      LHCI_BASE_URL: https://unibusk-preview-${{ github.event.pull_request.number }}.swyp.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.26.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lighthouse CI
        continue-on-error: true
        run: pnpm exec lhci autorun --config=.lighthouserc.ci.js

      - name: Comment Lighthouse Results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const baseUrl = process.env.LHCI_BASE_URL;
            const lhciDir = '.lighthouseci';
            let body = '## 🔦 Lighthouse CI Results\n\n';

            try {
              const files = fs.readdirSync(lhciDir)
                .filter(f => f.startsWith('lhr-') && f.endsWith('.json'))
                .sort();

              if (files.length === 0) {
                body += '⚠️ 측정 결과를 찾을 수 없습니다.';
              } else {
                const score = s => s == null ? 'N/A' : s >= 90 ? `🟢 ${s}` : s >= 80 ? `🟡 ${s}` : `🔴 ${s}`;

                body += '| URL | Performance | Accessibility | Best Practices | SEO |\n';
                body += '|-----|:-----------:|:-------------:|:--------------:|:---:|\n';

                const seen = new Set();
                for (const file of files) {
                  const lhr = JSON.parse(fs.readFileSync(`${lhciDir}/${file}`, 'utf8'));
                  const url = (lhr.finalUrl || lhr.requestedUrl).replace(baseUrl, '') || '/';
                  if (seen.has(url)) continue;
                  seen.add(url);

                  const perf = lhr.categories.performance?.score != null ? Math.round(lhr.categories.performance.score * 100) : null;
                  const a11y = lhr.categories.accessibility?.score != null ? Math.round(lhr.categories.accessibility.score * 100) : null;
                  const bp   = lhr.categories['best-practices']?.score != null ? Math.round(lhr.categories['best-practices'].score * 100) : null;
                  const seo  = lhr.categories.seo?.score != null ? Math.round(lhr.categories.seo.score * 100) : null;

                  body += `| \`${url}\` | ${score(perf)} | ${score(a11y)} | ${score(bp)} | ${score(seo)} |\n`;
                }
              }
            } catch (e) {
              body += `⚠️ 결과 파싱 실패: ${e.message}`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existing = comments.find(
              c => c.user.login === 'github-actions[bot]' && c.body.includes('🔦 Lighthouse CI Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }
